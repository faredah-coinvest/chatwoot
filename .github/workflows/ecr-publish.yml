# Build Chatwoot image and push to AWS ECR (linux/amd64).
#
# Branch mapping:
# - develop -> ECR_REPOSITORY (example: prod-chatwoot)
# - stg     -> stg-chatwoot (derived from ECR_REPOSITORY by replacing prod- with stg-)

name: Publish to AWS ECR

on:
  push:
    branches:
      - develop
      - stg
  workflow_dispatch:

concurrency:
  group: ecr-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target ECR repository
        run: |
          if [ "${GITHUB_REF_NAME}" = "stg" ]; then
            echo "TARGET_ECR_REPOSITORY=${ECR_REPOSITORY/prod-/stg-}" >> "$GITHUB_ENV"
          else
            echo "TARGET_ECR_REPOSITORY=${ECR_REPOSITORY}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.TARGET_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.TARGET_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy staging on EC2
        if: github.ref_name == 'stg'
        uses: appleboy/ssh-action@master
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        with:
          host: ${{ secrets.STG_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script: |
            set -euo pipefail

            cd ~/chatwoot

            echo "Checking available disk space..."
            FREE_SPACE=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
            echo "Free space available: ${FREE_SPACE} GB"

            if [ "$FREE_SPACE" -lt 5 ]; then
              echo "Low disk space (<5GB). Running Docker cleanup..."
              docker container prune -f
              docker image prune -af
              docker builder prune -af
            else
              echo "Enough disk space. Skipping Docker cleanup."
            fi

            echo "Pulling latest code..."
            git fetch origin stg
            git checkout stg
            git pull --ff-only origin stg

            if command -v aws >/dev/null 2>&1; then
              echo "Refreshing ECR login..."
              aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            fi

            echo "Deploying Chatwoot..."
            chmod +x script/deploy_chatwoot_compose.sh
            script/deploy_chatwoot_compose.sh --stg

            echo "Deployment complete."

      - name: Deploy production on EC2
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@master
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script: |
            set -euo pipefail

            cd ~/chatwoot

            echo "Checking available disk space..."
            FREE_SPACE=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
            echo "Free space available: ${FREE_SPACE} GB"

            if [ "$FREE_SPACE" -lt 5 ]; then
              echo "Low disk space (<5GB). Running Docker cleanup..."
              docker container prune -f
              docker image prune -af
              docker builder prune -af
            else
              echo "Enough disk space. Skipping Docker cleanup."
            fi

            echo "Pulling latest code..."
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop

            if command -v aws >/dev/null 2>&1; then
              echo "Refreshing ECR login..."
              aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            fi

            echo "Deploying Chatwoot..."
            chmod +x script/deploy_chatwoot_compose.sh
            script/deploy_chatwoot_compose.sh

            echo "Deployment complete."
