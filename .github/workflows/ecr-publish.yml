# Build Chatwoot image and push to AWS ECR (linux/amd64).
#
# Branch mapping:
# - develop -> ECR_REPOSITORY (example: prod-chatwoot)
# - stg     -> stg-chatwoot (derived from ECR_REPOSITORY by replacing prod- with stg-)

name: Publish to AWS ECR

on:
  push:
    branches:
      - develop
      - stg
  workflow_dispatch:

concurrency:
  group: ecr-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target ECR repository
        run: |
          if [ "${GITHUB_REF_NAME}" = "stg" ]; then
            echo "TARGET_ECR_REPOSITORY=${ECR_REPOSITORY/prod-/stg-}" >> "$GITHUB_ENV"
          else
            echo "TARGET_ECR_REPOSITORY=${ECR_REPOSITORY}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.TARGET_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.TARGET_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
